<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Dépenses Courantes{% endblock %}</title>
  <style>
    :root {
      /* Palette principale : violet / blanc / bleu clair */
      --couleur-fond: #ffffff;
      --couleur-texte: #2b2033;
      --couleur-violet: #6a2c91;
      --couleur-violet-clair: #f1e8f7;
      --couleur-bleu: #2f9bd6;
      --couleur-bleu-clair: #e7f4fb;
      --couleur-bordure: #e6e1ea;

      /* Couleurs fonctionnelles : uniquement pour distinguer dépense/recette
         d'un coup d'oeil, indépendamment de l'identité visuelle */
      --couleur-depense: #b3452f;
      --couleur-depense-claire: #f7e9e5;
      --couleur-recette: var(--couleur-bleu);

      /* Statuts de compte */
      --couleur-attente: #a5751f;
      --couleur-attente-claire: #faf1de;
      --couleur-ignore: #857f89;
      --couleur-ignore-claire: #f1eef2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--couleur-fond);
      color: var(--couleur-texte);
    }
    header {
      background: var(--couleur-violet);
      color: white;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 2rem;
    }
    header h1 {
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: 0.02em;
      font-weight: 600;
    }
    nav a {
      color: #e6d9ef;
      text-decoration: none;
      font-size: 0.95rem;
      margin-right: 1.3rem;
    }
    nav a:hover, nav a:focus-visible { color: white; text-decoration: underline; }
    main { max-width: 950px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
    h2 { font-weight: 600; font-size: 1.3rem; }
    h3 { color: var(--couleur-violet); }
    p.description { color: #63596b; max-width: 60ch; }
    a { color: var(--couleur-bleu); }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.3rem;
      font-size: 0.95rem;
    }
    .message.succes {
      background: var(--couleur-bleu-clair);
      color: #205a7a;
      border: 1px solid var(--couleur-bleu);
    }
    .message.erreur {
      background: var(--couleur-depense-claire);
      color: var(--couleur-depense);
      border: 1px solid var(--couleur-depense);
    }
    .message.avertissement {
      background: var(--couleur-attente-claire);
      color: var(--couleur-attente);
      border: 1px solid #d9b26b;
    }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--couleur-bordure); font-size: 0.92rem; vertical-align: middle; }
    th { font-weight: 600; color: #6b6272; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; }
    td.colonne-montant, th.colonne-montant { text-align: right; }
    td.colonne-numero { font-variant-numeric: tabular-nums; color: #6b6272; font-size: 0.85rem; }
    .montant-depense { color: var(--couleur-depense); }
    .montant-recette { color: var(--couleur-recette); }

    .etiquette-categorie {
      background: var(--couleur-violet-clair);
      color: var(--couleur-violet);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .etiquette-sans-categorie { color: #a99fb0; font-size: 0.85rem; }

    .badge-statut {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .badge-statut.statut-suivi { background: var(--couleur-bleu-clair); color: #205a7a; }
    .badge-statut.statut-en_attente { background: var(--couleur-attente-claire); color: var(--couleur-attente); }
    .badge-statut.statut-ignore { background: var(--couleur-ignore-claire); color: var(--couleur-ignore); }

    form.formulaire-import {
      background: white;
      border: 1px solid var(--couleur-bordure);
      border-radius: 10px;
      padding: 1.5rem;
    }
    form.formulaire-import input[type=file] { display: block; margin-bottom: 1rem; width: 100%; }

    .zones-import {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    @media (max-width: 640px) {
      .zones-import { grid-template-columns: 1fr; }
    }
    form.formulaire-import h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
    p.description-zone { color: #63596b; font-size: 0.88rem; margin-top: 0; }

    form.formulaire-renommer { display: flex; gap: 0.4rem; }
    form.formulaire-renommer input[type=text] {
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }
    .actions-compte { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .pastille-compte {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 50%;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    form.formulaire-compte {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    form.formulaire-compte .champ-lettre {
      width: 2.4rem;
      text-align: center;
      padding: 0.35rem 0;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    form.formulaire-compte .champ-couleur {
      padding: 0.35rem 0.4rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    form.formulaire-compte .champ-nom {
      flex: 1;
      min-width: 160px;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    th.colonne-date, td.colonne-date { white-space: nowrap; width: 6.5rem; }
    th.colonne-compte, td.colonne-compte { width: 3rem; text-align: center; }

    td.colonne-compte-affiche { display: flex; align-items: center; gap: 0.6rem; }
    th.colonne-actions, td.colonne-actions { text-align: right; }

    tr.ligne-edition-compte td {
      background: var(--couleur-violet-clair);
      padding: 0.7rem;
      vertical-align: middle;
    }
    .cellule-edition-compte {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .champ-statut {
      padding: 0.35rem 0.4rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    tr.ligne-edition-categorie td {
      background: var(--couleur-violet-clair);
      padding: 1rem;
    }
    .panneau-edition-categorie {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .section-edition h3 {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
    }
    .section-edition-fermer { align-items: flex-start; }
    .liste-correspondances, .liste-mots-cles {
      list-style: none;
      padding: 0;
      margin: 0 0 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .liste-mots-cles li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      width: fit-content;
      font-size: 0.88rem;
    }
    .formulaire-inline { display: inline; }
    .bouton-mini { padding: 0.2rem 0.6rem; font-size: 0.78rem; }
    .formulaire-ajout-mot-cle { display: flex; gap: 0.4rem; }
    .formulaire-ajout-mot-cle input[type=text] {
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 220px;
    }

    /* Filtres (pages Opérations et Dashboard) */
    form.formulaire-filtres {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1.2rem;
      background: white;
      border: 1px solid var(--couleur-bordure);
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .groupe-filtre { display: flex; flex-direction: column; gap: 0.3rem; }
    .groupe-filtre label, .etiquette-groupe-filtre {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b6272;
      font-weight: 600;
    }
    .groupe-filtre select {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .groupe-filtre-cases { max-width: 320px; }
    .cases-filtre {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.9rem;
      font-size: 0.85rem;
    }
    .cases-filtre label { text-transform: none; letter-spacing: normal; font-weight: 400; color: var(--couleur-texte); display: flex; align-items: center; gap: 0.3rem; }

    /* La liste des catégories peut être longue : grille à colonnes fixes
       et hauteur limitée avec défilement, plutôt qu'un mur de cases qui
       s'enchaînent de façon désordonnée. */
    .groupe-filtre-categories { max-width: none; width: 100%; }
    .cases-filtre-categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.5rem 1rem;
      max-height: 220px;
      overflow-y: auto;
      padding: 0.8rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      background: var(--couleur-fond);
    }
    .cases-filtre-categories label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions-filtres { display: flex; gap: 0.6rem; align-items: center; }

    .formulaire-categorie-operation select {
      border: 1px solid var(--couleur-bordure);
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      max-width: 220px;
    }

    .formulaire-nouvelle-categorie {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.3rem;
    }
    .formulaire-nouvelle-categorie input[type=text] {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 240px;
    }
    .case-exclusion-stats {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--couleur-texte);
      white-space: nowrap;
    }
    .badge-exclusion-stats {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      background: var(--couleur-ignore-claire);
      color: var(--couleur-ignore);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Regroupement mensuel (page Opérations) */
    h3.titre-groupe-mois {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 1.6rem 0 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--couleur-violet);
    }
    .total-groupe-mois { font-size: 0.85rem; font-weight: 500; color: var(--couleur-depense); }

    /* Grille de graphiques (page Dashboard) */
    .grille-graphiques {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
    }
    @media (max-width: 800px) {
      .grille-graphiques { grid-template-columns: 1fr; }
    }
    .carte-graphique {
      background: white;
      border: 1px solid var(--couleur-bordure);
      border-radius: 10px;
      padding: 1.1rem;
    }
    .carte-graphique h3 { margin: 0 0 0.7rem; font-size: 0.95rem; }
    .carte-graphique-large { grid-column: 1 / -1; }

    button, .bouton {
      background: var(--couleur-violet);
      color: white;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button:hover, .bouton:hover { opacity: 0.9; }
    button.bouton-secondaire {
      background: white;
      color: var(--couleur-violet);
      border: 1px solid var(--couleur-violet);
    }
    button.bouton-discret {
      background: white;
      color: var(--couleur-ignore);
      border: 1px solid var(--couleur-bordure);
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--couleur-violet);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Dépenses Courantes</h1>
    <nav>
      <a href="{{ url_for('page_dashboard') }}">Dashboard</a>
      <a href="{{ url_for('page_operations') }}">Opérations</a>
      <a href="{{ url_for('page_historique') }}">Historique</a>
      <a href="{{ url_for('page_categories') }}">Catégories</a>
      <a href="{{ url_for('page_comptes') }}">Comptes</a>
      <a href="{{ url_for('page_import') }}">Importer</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for categorie, message in messages %}
        <div class="message {{ categorie }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
